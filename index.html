<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sunny | absolute elite v7</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Grotesk:wght@300;500;700&display=swap');

        :root {
            --white: #ffffff;
            --discord: #5865F2;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        body { background: #000; color: #fff; font-family: 'Space Grotesk', sans-serif; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }

        /* --- FOND --- */
        .bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: #000; }
        #bg-media { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.15) grayscale(1); transform: scale(1.1); transition: 0.8s ease-out; }
        #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 0%, #000 140%); z-index: -1; }

        /* --- ENTER SCREEN --- */
        #enter-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; transition: 1.5s cubic-bezier(0.9, 0, 0.1, 1); }
        #enter-screen.hidden { opacity: 0; visibility: hidden; filter: blur(50px); transform: scale(1.5); }
        #enter-text { font-family: 'Syncopate', sans-serif; letter-spacing: 20px; font-size: 0.8rem; text-transform: uppercase; }

        /* --- CARD --- */
        .card-container { perspective: 2000px; z-index: 10; }
        .card {
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px);
            padding: 40px; width: 420px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative; transform-style: preserve-3d; transition: 0.1s;
        }

        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px; object-fit: cover; }
        .name { font-family: 'Syncopate', sans-serif; font-size: 1.6rem; letter-spacing: 12px; margin-bottom: 25px; text-transform: uppercase; background: linear-gradient(#fff, #444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* --- DISCORD LIVE WIDGET (STYLISÉ) --- */
        .discord-box {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.05);
            padding: 20px; border-radius: 4px; margin-bottom: 20px; text-align: left;
            display: flex; flex-direction: column; gap: 15px;
        }
        .discord-header { display: flex; align-items: center; gap: 12px; }
        .srv-icon { width: 45px; height: 45px; border-radius: 12px; background: #222; }
        .srv-title { flex-grow: 1; }
        .srv-name { font-weight: 700; font-size: 0.85rem; display: block; color: #fff; }
        .srv-online { font-size: 0.65rem; color: #666; font-weight: 700; }
        .srv-online span { color: #43b581; margin-right: 4px; }
        
        .join-btn {
            background: var(--discord); color: #fff; text-decoration: none; text-align: center;
            padding: 10px; border-radius: 3px; font-size: 0.75rem; font-weight: 900;
            transition: 0.3s; letter-spacing: 1px;
        }
        .join-btn:hover { background: #4752c4; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(88, 101, 242, 0.3); }

        /* --- LINKS & AUDIO --- */
        .links { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
        .link { text-decoration: none; color: #444; padding: 12px; border: 1px solid rgba(255,255,255,0.02); font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; transition: 0.3s; font-weight: 700; }
        .link:hover { color: #fff; border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.03); }

        .music-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; background: rgba(255,255,255,0.02); border-radius: 2px;
        }
        .play-btn { background: none; border: 1px solid #fff; color: #fff; width: 30px; height: 30px; border-radius: 50%; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .play-btn:hover { background: #fff; color: #000; }
        .track-name { font-size: 0.6rem; letter-spacing: 2px; color: #666; font-weight: 700; }

    </style>
</head>
<body>

    <div id="enter-screen" onclick="init()">
        <p id="enter-text">Larp Larp sahur</p>
    </div>

    <div class="bg-container"><img src="9b888cfbddb78d54487799b8a63a495b.jpg" id="bg-media"></div>
    <canvas id="particles"></canvas>
    <div class="overlay"></div>

    <audio id="bg-audio" loop><source src="Weiland - Blue Bands (Official Audio).mp3" type="audio/mpeg"></audio>

    <div class="card-container">
        <div class="card" id="card">
            <img src="4b1c62017924debca83eab3c0b414215.jpg" class="avatar">
            <h1 class="name">sunny</h1>

            <div class="discord-box">
                <div class="discord-header">
                    <img id="srv-icon" src="" class="srv-icon">
                    <div class="srv-title">
                        <span id="srv-name" class="srv-name">Loading...</span>
                        <span class="srv-online"><span>●</span> <span id="srv-count">0</span> ONLINE</span>
                    </div>
                </div>
                <a id="srv-link" href="https://discord.gg/larpeur" target="_blank" class="join-btn">JOIN SERVER</a>
            </div>

            <div class="links">
                <a href="https://www.tiktok.com/@bloody_vampirism" target="_blank" class="link">TikTok</a>
                <a href="https://instagram.com" target="_blank" class="link">Instagram</a>
            </div>

            <div class="music-bar">
                <div class="track-name">BLUE BANDS</div>
                <button class="play-btn" id="music-btn" onclick="toggleMusic()">II</button>
            </div>
        </div>
    </div>

    <script>
        const SERVER_ID = "1498414364007469056"; 
        const audio = document.getElementById('bg-audio');
        const musicBtn = document.getElementById('music-btn');
        let entered = false;

        async function fetchDiscord() {
            try {
                const r = await fetch(`https://discord.com/api/guilds/${SERVER_ID}/widget.json`);
                const d = await r.json();
                document.getElementById('srv-name').innerText = d.name;
                document.getElementById('srv-count').innerText = d.presence_count;
                document.getElementById('srv-link').href = d.instant_invite;
                // On récupère l'icône via une autre API car le widget ne donne pas l'URL directe de l'image
                document.getElementById('srv-icon').src = `5dced98443c3559761e9b7ae3d739746.webp`;
            } catch(e) { console.error("Widget Discord non activé"); }
        }

        function init() {
            if(entered) return;
            entered = true;
            document.getElementById('enter-screen').classList.add('hidden');
            audio.volume = 0.4; audio.play();
            fetchDiscord();
            setInterval(fetchDiscord, 30000); // Refresh toutes les 30sec
        }

        function toggleMusic() {
            if(audio.paused) { audio.play(); musicBtn.innerText = "II"; }
            else { audio.pause(); musicBtn.innerText = "▶"; }
        }

        // PARTICULES
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let dots = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        for(let i=0; i<40; i++) { dots.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*1.2, speed: Math.random()*0.3 }); }
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle='rgba(255,255,255,0.1)';
            dots.forEach(d => { ctx.beginPath(); ctx.arc(d.x,d.y,d.size,0,Math.PI*2); ctx.fill(); d.y-=d.speed; if(d.y<0) d.y=canvas.height; });
            requestAnimationFrame(draw);
        }
        draw();

        // TILT
        document.addEventListener('mousemove', (e) => {
            if(!entered) return;
            const x = (window.innerWidth/2 - e.pageX)/50; const y = (window.innerHeight/2 - e.pageY)/50;
            document.getElementById('card').style.transform = `rotateX(${y}deg) rotateY(${-x}deg)`;
            document.getElementById('bg-media').style.transform = `scale(1.1) translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
